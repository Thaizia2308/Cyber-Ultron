<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cyber Ultron — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050810;
  --panel:#0a0f1e;
  --border:#1a2540;
  --green:#00ff88;
  --red:#ff3b3b;
  --blue:#3b82f6;
  --text:#c8d6f0;
  --dim:#4a5a7a;
  --mono:'Share Tech Mono',monospace;
  --orb:'Orbitron',monospace;
}
body{
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--mono);
  overflow:hidden;
  position:relative;
}

/* Animated grid background */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{to{background-position:40px 40px}}

/* Glowing orbs */
body::after{
  content:'';
  position:fixed;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(0,255,136,0.04) 0%,transparent 70%);
  top:-100px;left:-100px;
  animation:orbFloat 8s ease-in-out infinite alternate;
}
@keyframes orbFloat{to{transform:translate(80px,60px)}}

.login-wrap{
  position:relative;
  z-index:10;
  width:100%;max-width:420px;
  padding:0 1.5rem;
}

.logo-block{
  text-align:center;
  margin-bottom:2.5rem;
}
.logo-icon{
  font-size:2.8rem;
  display:block;
  margin-bottom:0.5rem;
  animation:iconPulse 2s ease-in-out infinite;
}
@keyframes iconPulse{0%,100%{text-shadow:0 0 20px rgba(0,255,136,0.5)}50%{text-shadow:0 0 40px rgba(0,255,136,0.9)}}

.logo-text{
  font-family:var(--orb);
  font-size:1.5rem;
  font-weight:900;
  color:var(--green);
  letter-spacing:4px;
  text-shadow:0 0 20px rgba(0,255,136,0.4);
}
.logo-sub{
  font-size:0.65rem;
  color:var(--dim);
  letter-spacing:3px;
  margin-top:4px;
  text-transform:uppercase;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:2.5rem;
  position:relative;
  overflow:hidden;
}
/* Corner accents */
.card::before,.card::after{
  content:'';
  position:absolute;
  width:20px;height:20px;
  border-color:var(--green);
  border-style:solid;
  opacity:0.5;
}
.card::before{top:0;left:0;border-width:2px 0 0 2px;border-radius:2px 0 0 0}
.card::after{bottom:0;right:0;border-width:0 2px 2px 0;border-radius:0 0 2px 0}

.card-title{
  font-family:var(--orb);
  font-size:0.72rem;
  color:var(--dim);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:1.75rem;
  text-align:center;
}

.field{margin-bottom:1.25rem}
.field label{
  display:block;
  font-size:0.65rem;
  color:var(--dim);
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:0.5rem;
}
.field input{
  width:100%;
  background:#06090f;
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:0.9rem;
  padding:0.75rem 1rem;
  border-radius:4px;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.field input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(0,255,136,0.08);
}
.field input::placeholder{color:var(--dim)}

.btn-login{
  width:100%;
  background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(0,255,136,0.05));
  border:1px solid rgba(0,255,136,0.4);
  color:var(--green);
  font-family:var(--orb);
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:3px;
  padding:0.85rem;
  border-radius:4px;
  cursor:pointer;
  transition:all 0.2s;
  text-transform:uppercase;
  margin-top:0.5rem;
}
.btn-login:hover{
  background:linear-gradient(135deg,rgba(0,255,136,0.25),rgba(0,255,136,0.1));
  box-shadow:0 0 20px rgba(0,255,136,0.2);
}
.btn-login:disabled{opacity:0.5;cursor:not-allowed}

.error-msg{
  color:var(--red);
  font-size:0.72rem;
  text-align:center;
  margin-top:1rem;
  min-height:1rem;
  letter-spacing:1px;
}

.hint{
  text-align:center;
  color:var(--dim);
  font-size:0.65rem;
  margin-top:1.5rem;
  letter-spacing:1px;
}
.hint span{color:var(--green)}

/* Scanning line */
@keyframes scan{0%{top:-2px}100%{top:100%}}
.scan-line{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,0.3),transparent);
  animation:scan 3s linear infinite;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-block">
    <span class="logo-icon">⬡</span>
    <div class="logo-text">CYBER ULTRON</div>
    <div class="logo-sub">Predictive Cyberattack Defence System</div>
  </div>

  <div class="card">
    <div class="scan-line"></div>
    <div class="card-title">Admin Authentication</div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password"/>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">
      ▶ Authenticate
    </button>

    <div class="error-msg" id="error-msg"></div>
    <div class="hint">Default: <span>admin</span> / <span>admin123</span></div>
  </div>
</div>

<script>
// If already logged in, redirect
if (localStorage.getItem("cy_token")) {
  window.location.href = "/dashboard";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

async function doLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const btn = document.getElementById("btn-login");
  const err = document.getElementById("error-msg");

  if (!username || !password) {
    err.textContent = "Username and password are required.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Authenticating...";
  err.textContent = "";

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.detail || "Authentication failed.";
      btn.disabled = false;
      btn.textContent = "▶ Authenticate";
      return;
    }

    localStorage.setItem("cy_token", data.access_token);
    localStorage.setItem("cy_user", data.username);
    window.location.href = "/dashboard";
  } catch (e) {
    err.textContent = "Cannot connect to server.";
    btn.disabled = false;
    btn.textContent = "▶ Authenticate";
  }
}
</script>
</body>
</html>
